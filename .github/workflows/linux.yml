name: Linux build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.*', 'installer/linux/**', '.github/workflows/linux.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev fonts-noto-cjk fonts-dejavu-core
      - name: Install Rust
        run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy rustfmt
      - name: Check
        run: |
          cargo fmt --all --check
          cargo clippy -p anemorph --all-targets --locked -- -D warnings
          cargo test -p anemorph --locked
      - name: Package
        run: sh installer/linux/package.sh
      - name: Save Linux downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: anemorph-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
