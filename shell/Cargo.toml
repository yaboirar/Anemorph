[package]
name = "anemorph-shell"
version = "0.0.3"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "0.58"
windows-sys = { version="0.61", features=["Win32_Foundation","Win32_System_Threading","Win32_System_Diagnostics_ToolHelp"] }
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
