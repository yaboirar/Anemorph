[package]
name = "anemorph"
version = "0.0.1"
edition = "2024"
build = "build.rs"
description = "A native Windows episode renamer with previews, custom formats, and undo"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu"] }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
