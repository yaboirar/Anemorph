[package]
name = "anemorph"
version = "0.0.3"
edition = "2024"
build = "build.rs"
description = "A native Windows video file renamer with previews, custom formats, and undo"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
wgpu = { version = "27", default-features = false, features = ["dx12", "wgsl"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
egui-winit = { version = "0.33.3", default-features = false, features = ["clipboard", "links"] }
winit = "0.30"
softbuffer = { version = "0.4", default-features = false }
bytemuck = "1"
regex = "1"
arabic_reshaper = "0.4.2"
unicode-bidi = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[workspace]
members = ["shell", "maintenance"]
resolver = "2"
